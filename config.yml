          title: Yuxin Guo
          tagline: "PhD Student<br/>Machine Learning Department<br/>Neuroscience Institute<br/>Carnegie Mellon University"
          subtitle: |
            Hi! I am a PhD student in the [Neural Computation and Machine Learning Joint Program](https://ml.cmu.edu/people/phd-students) at Carnegie Mellon University, advised by [Prof. Pulkit Grover](https://users.ece.cmu.edu/~pgrover/) and [Prof. Robert Kass](https://www.stat.cmu.edu/~kass/). My research lies at the intersection of machine learning and brain-computer interfaces. Specifically, I work on two directions.

            - **Reading** the brain through source localization and neural time-series analysis.
            - **Intervening** with the brain through spatially and temporally optimized electrical stimulation.

            Reading or intervening, I design algorithms that are accurate, safe, and reliable enough to actually trust on a brain.

            Previously, I received my B.S. in Electrical and Computer Engineering from Carnegie Mellon University.
